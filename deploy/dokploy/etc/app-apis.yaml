Name: app-apis
Host: 0.0.0.0
Port: 8888
Mode: pro
Timeout: 12000

Middlewares:
  Log: false

Log:
  Mode: console
  Encoding: json
  Level: ${LOG_LEVEL}
  Stat: ${LOG_STAT}

Auth:
  AccessSecret: "${AUTH_ACCESS_SECRET}"
  AccessExpire: ${AUTH_ACCESS_EXPIRE}

UserRpc:
  Timeout: 10000
  Endpoints:
    - ${USER_RPC_ENDPOINT}

InterviewRpc:
  Endpoints:
    - ${INTERVIEW_RPC_ENDPOINT}

QuestionRpc:
  Endpoints:
    - ${QUESTION_RPC_ENDPOINT}

# app-apis 直接上传简历到阿里云 OSS；真实凭证由 Dokploy Environment 注入。
OSS:
  Region: "${OSS_REGION}"                       # 例如 cn-hangzhou
  Endpoint: "${OSS_ENDPOINT}"                   # 必须是 HTTPS Endpoint
  Bucket: "${OSS_BUCKET}"                       # 保存简历的私有 Bucket
  AccessKeyID: "${OSS_ACCESS_KEY_ID}"           # 仅授予目标 Bucket 最小权限
  AccessKeySecret: "${OSS_ACCESS_KEY_SECRET}"   # 不得写入仓库或日志
  ObjectURLPrefix: "${OSS_OBJECT_URL_PREFIX}"   # 不带临时签名的稳定 URL 前缀

Websocket:
  PublicUrl: "${WEBSOCKET_PUBLIC_URL}"
