services:
  qdrant:
    image: "qdrant/qdrant:v1.18.3"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      dokploy-network:
        aliases:
          - whetstone-qdrant
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  qdrant_data: {}

networks:
  dokploy-network:
    external: true
