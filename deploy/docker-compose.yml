services:
  app-apis:
    build:
      context: ..
      dockerfile: Dockerfile
      target: app-apis
    restart: unless-stopped
    environment:
      CONFIG_SOURCE: env
      AUTH_ACCESS_SECRET: whetstone-dev-secret-change-me
      AUTH_ACCESS_EXPIRE: "604800"
      WEBSOCKET_PUBLIC_URL: ws://127.0.0.1:8888/ws
      USER_RPC_ENDPOINT: user-rpc:9001
      INTERVIEW_RPC_ENDPOINT: interview-rpc:9002
      QUESTION_RPC_ENDPOINT: question-rpc:9003
      OSS_REGION: ${OSS_REGION:?OSS_REGION is required}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT is required}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_OBJECT_URL_PREFIX: ${OSS_OBJECT_URL_PREFIX:?OSS_OBJECT_URL_PREFIX is required}
      LOG_LEVEL: info
      LOG_STAT: "false"
      TZ: Asia/Shanghai
    depends_on:
      - user-rpc
      - interview-rpc
      - question-rpc
      - mysql
      - redis
      - qdrant
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  user-rpc:
    build:
      context: ..
      dockerfile: Dockerfile
      target: user-rpc
    restart: unless-stopped
    environment:
      CONFIG_SOURCE: env
      LOG_LEVEL: info
      LOG_STAT: "false"
      TZ: Asia/Shanghai

  interview-rpc:
    build:
      context: ..
      dockerfile: Dockerfile
      target: interview-rpc
    restart: unless-stopped
    environment:
      CONFIG_SOURCE: env
      LOG_LEVEL: info
      LOG_STAT: "false"
      TZ: Asia/Shanghai

  question-rpc:
    build:
      context: ..
      dockerfile: Dockerfile
      target: question-rpc
    restart: unless-stopped
    environment:
      CONFIG_SOURCE: env
      LOG_LEVEL: info
      LOG_STAT: "false"
      TZ: Asia/Shanghai

  report-worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: report-worker
    restart: unless-stopped
    environment:
      CONFIG_SOURCE: env
      LOG_LEVEL: info
      LOG_STAT: "false"
      TZ: Asia/Shanghai

  mysql:
    image: mysql:8.0
    container_name: whetstone-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: whetstone
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: whetstone-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: whetstone-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: whetstone-minio
    environment:
      MINIO_ROOT_USER: whetstone
      MINIO_ROOT_PASSWORD: whetstone123
    ports:
      - "9000:9000"
      - "9090:9090"
    command: server /data --console-address ":9090"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  qdrant_data:
  minio_data:
