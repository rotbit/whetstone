<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 面试陪练平台总体架构图" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <title>AI 面试陪练平台总体架构（Go + go-zero）</title>
  <desc>客户端经统一 app-apis 的 REST 与 WebSocket 接入；核心服务层包含 interview-rpc、question-rpc、user-rpc、report-worker；llm-adapter 统一封装 LLM、ASR、TTS 上游服务；基础设施为 MySQL、Redis、Qdrant、OSS、asynq；右侧为支付渠道与上游 AI 服务。</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">AI 面试陪练平台总体架构（Go + go-zero）</text>

  <!-- 客户端 -->
  <text x="40" y="56" font-size="11" fill="#64748b">客户端</text>
  <rect x="40" y="62" width="190" height="50" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="135" y="92" text-anchor="middle" font-size="14" fill="#3730A3">Web · React</text>
  <rect x="250" y="62" width="190" height="50" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="345" y="92" text-anchor="middle" font-size="14" fill="#3730A3">微信小程序（P1）</text>
  <rect x="460" y="62" width="190" height="50" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="555" y="92" text-anchor="middle" font-size="14" fill="#3730A3">B 端后台（P2）</text>

  <line x1="135" y1="114" x2="135" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="345" y1="114" x2="345" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="555" y1="114" x2="555" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Dokploy Compose 部署边界 -->
  <rect x="25" y="128" width="640" height="286" rx="12" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="650" y="124" text-anchor="end" font-size="11" font-weight="600" fill="#475569">Dokploy Compose · 5 个独立容器</text>

  <!-- 接入层 -->
  <rect x="40" y="142" width="295" height="84" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="187" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">app-apis · REST</text>
  <text x="187" y="192" text-anchor="middle" font-size="11.5" fill="#047857">用户 · 简历上传 · 订单 · 报告</text>
  <rect x="355" y="142" width="295" height="84" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="502" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">app-apis · WebSocket</text>
  <text x="502" y="186" text-anchor="middle" font-size="11.5" fill="#047857">心跳 · 断线重连 · 会话恢复</text>
  <text x="502" y="208" text-anchor="middle" font-size="11.5" fill="#047857">同一进程 · 上行音频/文本 · 下行音频流</text>

  <line x1="187" y1="226" x2="187" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="502" y1="226" x2="502" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 核心服务层 -->
  <text x="40" y="246" font-size="11" fill="#64748b">核心服务层（独立容器 · zRPC）</text>
  <rect x="40" y="254" width="140" height="64" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="110" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">interview-rpc</text>
  <text x="110" y="298" text-anchor="middle" font-size="10.5" fill="#B45309">面试引擎 · 追问</text>
  <rect x="196" y="254" width="140" height="64" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="266" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">question-rpc</text>
  <text x="266" y="298" text-anchor="middle" font-size="10.5" fill="#B45309">题库 · RAG 出题</text>
  <rect x="352" y="254" width="140" height="64" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="422" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">user-rpc</text>
  <text x="422" y="298" text-anchor="middle" font-size="10.5" fill="#B45309">次数 · 订单</text>
  <rect x="508" y="254" width="140" height="64" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="578" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">report-worker</text>
  <text x="578" y="298" text-anchor="middle" font-size="10.5" fill="#B45309">异步评分 · 报告</text>

  <!-- 支付 -->
  <rect x="700" y="254" width="260" height="64" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="830" y="278" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6B21A8">支付渠道</text>
  <text x="830" y="298" text-anchor="middle" font-size="11" fill="#7E22CE">微信支付 · 支付宝 · 回调验签</text>
  <line x1="650" y1="286" x2="696" y2="286" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="673" y="278" text-anchor="middle" font-size="10" fill="#64748b">下单/回调</text>

  <line x1="345" y1="318" x2="345" y2="342" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- AI 能力层 -->
  <rect x="40" y="346" width="610" height="56" rx="8" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="345" y="368" text-anchor="middle" font-size="13.5" font-weight="700" fill="#155E75">llm-adapter · AI 能力层</text>
  <text x="345" y="390" text-anchor="middle" font-size="11.5" fill="#0E7490">LLM · ASR · TTS 多厂商统一封装（mini AI 网关，可独立成库）</text>

  <!-- 上游 AI 服务 -->
  <rect x="700" y="330" width="260" height="120" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="830" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">上游 AI 服务</text>
  <text x="830" y="380" text-anchor="middle" font-size="12" fill="#7F1D1D">LLM：DeepSeek · Qwen · GPT</text>
  <text x="830" y="402" text-anchor="middle" font-size="12" fill="#7F1D1D">ASR / TTS：火山 · 讯飞 · 阿里云</text>
  <text x="830" y="428" text-anchor="middle" font-size="11" font-style="italic" fill="#B91C1C">全部走流式接口</text>
  <line x1="652" y1="374" x2="696" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="673" y="366" text-anchor="middle" font-size="10" fill="#64748b">流式调用</text>

  <line x1="345" y1="402" x2="345" y2="426" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 基础设施 -->
  <text x="40" y="424" font-size="11" fill="#64748b">基础设施</text>
  <rect x="40" y="430" width="110" height="56" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="95" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">MySQL</text>
  <text x="95" y="470" text-anchor="middle" font-size="10" fill="#475569">业务数据</text>
  <rect x="163" y="430" width="110" height="56" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="218" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Redis</text>
  <text x="218" y="470" text-anchor="middle" font-size="10" fill="#475569">会话 · 限流</text>
  <rect x="286" y="430" width="110" height="56" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="341" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Qdrant</text>
  <text x="341" y="470" text-anchor="middle" font-size="10" fill="#475569">题库向量</text>
  <rect x="409" y="430" width="110" height="56" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="464" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">OSS</text>
  <text x="464" y="470" text-anchor="middle" font-size="10" fill="#475569">简历 · 音频</text>
  <rect x="532" y="430" width="110" height="56" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="587" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">asynq</text>
  <text x="587" y="470" text-anchor="middle" font-size="10" fill="#475569">报告任务队列</text>

  <!-- 说明 -->
  <text x="40" y="518" font-size="11.5" fill="#475569">实时语音链路：音频 → ASR 流式 → LLM 流式 → TTS 流式 → 播放；端到端首响 &lt; 2 秒，支持打断（barge-in）。</text>
  <text x="40" y="538" font-size="11" fill="#94a3b8">M1 先文字模式跑通面试引擎与报告，M2 接语音管道 —— 演进路径见《AI面试陪练-技术方案》文档。</text>
</svg>
