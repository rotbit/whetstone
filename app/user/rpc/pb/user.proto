syntax = "proto3";

package user;
option go_package = "./pb";

// 用户域内部服务：用户信息 / 次数幂等扣减
service User {
  rpc Register(RegisterReq) returns (RegisterResp);

  rpc Login(LoginRep) returns (LoginResp);

  rpc GetUser(GetUserReq) returns (UserInfo);

  // 保存 app-apis 已上传成功的 OSS 简历元数据；oss_url 用作跨重试幂等键
  rpc SaveResume(SaveResumeReq) returns (SaveResumeResp);


  // 面试开始前扣减次数；session_id 作幂等键，重复调用不重复扣
  rpc DeductCredit(DeductCreditReq) returns (DeductCreditResp);

  // 面试异常中断时回补次数（同样以 session_id 幂等）
  rpc RefundCredit(RefundCreditReq) returns (RefundCreditResp);
}

message RegisterReq {
  string phone    = 1;
  string password = 2;
}

message RegisterResp {
  int64  user_id = 1;
  string phone   = 2;
  string plan    = 3;
}

message LoginRep {
  string phone = 1;
  string password = 2;
}

message LoginResp {
  int64 user_id  = 1;
  string phone = 2;
  string plan = 3;
  string accessToken =4;
  int64  expireAt = 5;
}

message GetUserReq {
  int64 user_id = 1;
}

message UserInfo {
  int64  user_id = 1;
  string phone   = 2;
  string plan    = 3;
  int64  credits = 4;
}

// SaveResumeReq 由 app-apis 在 OSS 上传成功后构造，不直接接受公网客户端调用
message SaveResumeReq {
  int64 user_id = 1;
  string oss_url = 2;
}

//返回新建或幂等命中的同一份简历记录
message SaveResumeResp {
  int64 resume_id = 1;      //resume表主键
  string parse_state = 2;   //parsing\done\failed
}

message DeductCreditReq {
  int64  user_id    = 1;
  string session_id = 2;
  int64  amount     = 3;
}

message DeductCreditResp {
  bool  ok      = 1;
  int64 balance = 2;
}

message RefundCreditReq {
  int64  user_id    = 1;
  string session_id = 2;
}

message RefundCreditResp {
  bool ok = 1;
}
