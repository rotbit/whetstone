syntax = "proto3";

package user;
option go_package = "./pb";

// 用户域内部服务：用户信息 / 次数幂等扣减
service User {
  rpc Register(RegisterReq) returns (RegisterResp);

  rpc GetUser(GetUserReq) returns (UserInfo);

  // 面试开始前扣减次数；session_id 作幂等键，重复调用不重复扣
  rpc DeductCredit(DeductCreditReq) returns (DeductCreditResp);

  // 面试异常中断时回补次数（同样以 session_id 幂等）
  rpc RefundCredit(RefundCreditReq) returns (RefundCreditResp);
}

message RegisterReq {
  string phone    = 1;
  string password = 2;
}

message RegisterResp {
  int64  user_id = 1;
  string phone   = 2;
  string plan    = 3;
}

message GetUserReq {
  int64 user_id = 1;
}

message UserInfo {
  int64  user_id = 1;
  string phone   = 2;
  string plan    = 3;
  int64  credits = 4;
}

message DeductCreditReq {
  int64  user_id    = 1;
  string session_id = 2;
  int64  amount     = 3;
}

message DeductCreditResp {
  bool  ok      = 1;
  int64 balance = 2;
}

message RefundCreditReq {
  int64  user_id    = 1;
  string session_id = 2;
}

message RefundCreditResp {
  bool ok = 1;
}
