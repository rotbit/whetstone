syntax = "proto3";

package interview;
option go_package = "./pb";

// 面试引擎：状态机推进与追问决策（核心业务逻辑）
// 状态机：开场 → 项目深挖 → 基础知识 → 场景算法 → 候选人反问 → 收尾
service Interview {
  // 初始化状态机，返回开场白与第一题
  rpc StartSession(StartSessionReq) returns (StartSessionResp);

  // 提交候选人回答 → 引擎决策：追问 / 下一题 / 结束
  rpc SubmitAnswer(SubmitAnswerReq) returns (SubmitAnswerResp);

  // 提前结束（触发报告任务入队）
  rpc EndSession(EndSessionReq) returns (EndSessionResp);

  // ws 断线重连时恢复会话状态
  rpc GetSessionState(GetSessionStateReq) returns (SessionState);
}

enum NextAction {
  FOLLOWUP = 0; // 追问（最多 2 层）
  NEXT     = 1; // 下一题
  FINISH   = 2; // 面试结束
}

message StartSessionReq {
  string session_id = 1;
  int64  user_id    = 2;
  string position   = 3;
  int64  resume_id  = 4;
  int64  jd_id      = 5;
}

message StartSessionResp {
  string opening  = 1; // 开场白
  string question = 2; // 第一题
  int32  seq      = 3;
}

message SubmitAnswerReq {
  string session_id = 1;
  int32  seq        = 2;
  string answer     = 3;
}

message SubmitAnswerResp {
  NextAction action = 1;
  string     reply  = 2; // 面试官回应（追问内容 / 下一题 / 收尾语）
  int32      seq    = 3;
}

message EndSessionReq {
  string session_id = 1;
}

message EndSessionResp {
  bool ok = 1;
}

message GetSessionStateReq {
  string session_id = 1;
}

message SessionState {
  string phase          = 1; // 状态机所处阶段
  int32  seq            = 2;
  int32  followup_depth = 3;
  string last_question  = 4;
}
