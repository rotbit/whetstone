Name: app-apis
Host: 0.0.0.0
Port: 8888
Timeout: 12000

Middlewares:
  Log: false

Auth:
  AccessSecret: whetstone-dev-secret-change-me
  AccessExpire: 604800

UserRpc:
  Timeout: 10000
  Endpoints:
    - 127.0.0.1:9001

InterviewRpc:
  Endpoints:
    - 127.0.0.1:9002

QuestionRpc:
  Endpoints:
    - 127.0.0.1:9003

# app-apis 直接上传简历到阿里云 OSS；真实凭证必须通过环境变量注入。
OSS:
  Region: "${OSS_REGION}"                       # 例如 cn-hangzhou
  Endpoint: "${OSS_ENDPOINT}"                   # 必须是 HTTPS Endpoint
  Bucket: "${OSS_BUCKET}"                       # 保存简历的私有 Bucket
  AccessKeyID: "${OSS_ACCESS_KEY_ID}"           # 仅授予目标 Bucket 最小权限
  AccessKeySecret: "${OSS_ACCESS_KEY_SECRET}"   # 不得写入仓库或日志
  ObjectURLPrefix: "${OSS_OBJECT_URL_PREFIX}"   # 不带临时签名的稳定 URL 前缀

Websocket:
  PublicUrl: ws://127.0.0.1:8888/ws
