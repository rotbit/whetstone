Name: app-apis
Host: 0.0.0.0
Port: 8888
Timeout: 12000

Middlewares:
  Log: false

Auth:
  AccessSecret: whetstone-dev-secret-change-me
  AccessExpire: 604800

UserRpc:
  Timeout: 10000
  Endpoints:
    - 127.0.0.1:9001

InterviewRpc:
  Endpoints:
    - 127.0.0.1:9002

QuestionRpc:
  Endpoints:
    - 127.0.0.1:9003

OSS:
  Region: "${OSS_REGION}"
  Endpoint: "${OSS_ENDPOINT}"
  Bucket: "${OSS_BUCKET}"
  AccessKeyID: "${OSS_ACCESS_KEY_ID}"
  AccessKeySecret: "${OSS_ACCESS_KEY_SECRET}"
  ObjectURLPrefix: "${OSS_OBJECT_URL_PREFIX}"

Websocket:
  PublicUrl: ws://127.0.0.1:8888/ws
